<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnada · Stems</title>
<meta name="description" content="Biblioteca de stems para mastering de Carnada.">
<style>
:root{--bg:#070a04;--lime:#c0ff00;--lime-dim:#6e9600;--text:#eaf5d0;--muted:#9db07a;--glass:rgba(255,255,255,.07);--glass-b:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background-image:radial-gradient(520px 420px at 12% 8%,rgba(192,255,0,.40),transparent 70%),radial-gradient(560px 460px at 92% 92%,rgba(120,200,0,.32),transparent 70%),radial-gradient(420px 320px at 85% 10%,rgba(60,120,0,.35),transparent 70%);background-attachment:fixed}
.wrap{max-width:960px;margin:0 auto;padding:48px 16px 72px}
header{text-align:center;margin-bottom:40px}
pre.logo{margin:0 auto 12px;display:block;width:max-content;max-width:100%;overflow:hidden;color:var(--lime);font-weight:700;line-height:1.05;font-size:clamp(5px,1.35vw,11px);text-shadow:0 0 10px rgba(192,255,0,.55);white-space:pre;text-align:left}
header p{margin:0;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:24px;-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{padding:20px;display:flex;gap:18px;align-items:center}
.card svg{width:112px;height:112px;flex:none}
.card h2{margin:0 0 2px;font-size:22px}
.card .by{color:var(--muted);font-size:13px;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid rgba(192,255,0,.4);color:var(--lime);background:rgba(192,255,0,.08)}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;color:#0b1000;background:var(--lime);padding:9px 18px;border-radius:14px;box-shadow:0 0 18px rgba(192,255,0,.35);transition:transform .15s,box-shadow .15s}
.btn:hover,.btn:focus-visible{transform:translateY(-1px);box-shadow:0 0 28px rgba(192,255,0,.6);outline:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
footer b{color:var(--lime-dim)}
@media (max-width:520px){.card{flex-direction:column;text-align:center}.tags{justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
<header>
<pre class="logo" id="logo" aria-label="CARNADA"></pre>
<p>Biblioteca de stems · mastering</p>
</header>
<main><div id="list" class="grid" aria-live="polite"></div></main>
<footer>
<p>Las descargas están en un repositorio privado: hace falta iniciar sesión en GitHub con una cuenta invitada.</p>
<p><b>&gt;</b> Carnada</p>
</footer>
</div>
<script>
var LOGO=[
'      ..         ###     ##.         #.               ###   ###               ###',
'    .###.       .###     .##.       ###              ####   .###.            .###',
'   ###          ####     ####.     .###    ##.      .###.   .#####.          ####',
'  .##          #####    .##.###    ####    ##.      ####.   .##..###        #####',
'  ###          #####    ###  ###   #####   ##.     .####.   .##   ###       #####',
' .##          ######    ##.  .###  #####   ##.     #####.    ##    ###     ######',
' ###         ### ###    ########.  ##.###  ##.    ### ##.    ##     ##    ### ###',
'.##         .##  ###    #####.    .## .##  ##    ###  ###    ##    ###   .##  ###',
'###        .###..###.  .## .##    .##  ##..##   .###..###    ##   .##.  .###..###.',
'##.       .############.##  ###   .##  .#####  ############. ##.  ##.  .############',
'###     . .##     ##.  .##   ###  .##   ####.  ###    .##    ##. ##.   .##     ##.',
'.##   .##.##.     ###  .##    ### .##   .###. .##      ##.   ######    ###     ###',
' ###.###.###      .##  .##     ###.##    ###  ###      ###   #####    ###      .##',
'  #####  .         ##   ##      ##.       ..  .         #.   .###      .        ##',
'                                ###                         .##.',
'                                 ###                         .'
];
document.getElementById('logo').textContent=LOGO.join('\n');
var ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g1" cx="25%" cy="25%" r="60%"><stop offset="0" stop-color="#c0ff00" stop-opacity=".75"/><stop offset="1" stop-color="#c0ff00" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="80%" cy="85%" r="55%"><stop offset="0" stop-color="#78c800" stop-opacity=".6"/><stop offset="1" stop-color="#78c800" stop-opacity="0"/></radialGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient></defs><rect x="4" y="4" width="92" height="92" rx="22" fill="#0b1206"/><rect x="4" y="4" width="92" height="92" rx="22" fill="url(#g1)"/><rect x="4" y="4" width="92" height="92" rx="22" fill="url(#g2)"/><path d="M22 20h42l14 14v46a4 4 0 0 1-4 4H26a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="url(#gl)" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/><rect x="36" y="20" width="28" height="19" rx="2.5" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".6" stroke-width=".6"/><rect x="54" y="23" width="7" height="13" rx="1.5" fill="#000" fill-opacity=".6"/><rect x="28" y="50" width="46" height="26" rx="3" fill="#050802" fill-opacity=".85" stroke="#c0ff00" stroke-opacity=".6" stroke-width=".8"/><text x="51" y="68" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#c0ff00">CARNADA</text><rect x="68" y="72" width="6" height="6" rx="1" fill="#c0ff00" fill-opacity=".7"/></svg>';
var fav=document.createElement('link');fav.rel='icon';fav.href='data:image/svg+xml,'+encodeURIComponent(ICON);document.head.appendChild(fav);
fetch('songs.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(songs){
var list=document.getElementById('list');
if(!songs.length){list.innerHTML='<div class="glass empty">Todavía no hay canciones.</div>';return}
songs.sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(s){
var a=document.createElement('article');a.className='glass card';
var t=[s.bpm+' BPM',s.stems+' stems'].concat(s.extras?['+'+s.extras+' extra']:[],[s.format,s.level]);
a.innerHTML=ICON+'<div><h2></h2><div class="by"></div><div class="tags"></div><a class="btn" target="_blank" rel="noopener">Descargar stems</a></div>';
a.querySelector('h2').textContent=s.title;
a.querySelector('.by').textContent=s.artist+' · '+s.date;
a.querySelector('.tags').innerHTML=t.map(function(x){var e=document.createElement('span');e.className='tag';e.textContent=x;return e.outerHTML}).join('');
a.querySelector('.btn').href=s.release;
list.appendChild(a);
});
}).catch(function(){document.getElementById('list').innerHTML='<div class="glass empty">No se pudo cargar la lista.</div>'});
</script>
</body>
</html>
